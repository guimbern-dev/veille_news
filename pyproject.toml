[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille"
version = "1.0.0"
description = "Tableau de bord personnel de veille quotidienne"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["veille"]

[tool.pytest.ini_options]
testpaths = ["tests"]
