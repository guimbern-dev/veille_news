# Édition quotidienne : collecte, résumés, enregistrement des données, publication du site.
name: Veille quotidienne

on:
  schedule:
    # 10 h UTC tous les jours : 6 h l'été et 5 h l'hiver à Montréal.
    # GitHub peut retarder un déclenchement planifié de quelques minutes.
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write    # valider data/ dans le dépôt
  pages: write       # publier sur GitHub Pages
  id-token: write    # exigé par le déploiement Pages

# Une seule exécution à la fois ; une exécution en cours n'est jamais annulée.
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -e '.[dev]'

      - name: Tests
        run: pytest -q

      # Si cette étape échoue (aucune nouvelle collectée), rien n'est publié :
      # le site de la veille reste en ligne et GitHub envoie un courriel.
      - name: Produire l'édition du jour
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python -m veille run

      - name: Enregistrer les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement dans data/"
          else
            git commit -m "chore: édition du $(TZ=America/Toronto date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: edition
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
